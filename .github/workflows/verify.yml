name: verify

# Sözlük dosyası manifest.json ile uyuşuyor mu (sha256, sayılar, lisans). Public depoda hosted runner ücretsizdir.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 verify.py
